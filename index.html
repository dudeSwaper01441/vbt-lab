 the atoms bonded to the atom you are assessing. A double or triple bond still counts as ONE σ bond.`},{title:`Add the lone pairs`,body:`Add the lone pairs on that atom to the σ count. The sum is the steric number (SN). π bonds never enter this sum.`},{title:`Read the SN`,body:`SN 2 gives sp and linear electron geometry. SN 3 gives sp² and trigonal planar. SN 4 gives sp³ and tetrahedral. SN 5 gives sp³d and trigonal bipyramidal. SN 6 gives sp³d² and octahedral.`},{title:`One atom at a time`,body:`Work through an example. Oxygen in water is bonded to two H atoms and has two lone pairs. σ = 2, lone pairs = 2, so SN = 4, hybridization = sp³, and the molecular shape is bent.`,exampleMoleculeId:`water`}]},{id:`shape-and-angles`,title:`Shape and angles`,summary:`Electron geometry versus molecular geometry.`,screens:[{title:`Two different names`,body:`Hybridization follows the electron geometry, which comes from SN. The molecular shape ignores lone pairs. That is why one SN can produce more than one molecular geometry.`},{title:`Lone pairs squeeze angles`,body:`Lone pairs squeeze bond angles below the ideal value. NH₃ is ≈107° and H₂O is ≈104.5°, both below the tetrahedral 109.5°.`,exampleMoleculeId:`ammonia`},{title:`Worked example: water`,body:`Oxygen in water: two σ bonds, two lone pairs, SN = 4. Hybridization sp³. Electron geometry tetrahedral. Molecular geometry bent, angle ≈104.5°, below the ideal 109.5° because of the lone pairs.`}]},{id:`s-character`,title:`s-character trends`,summary:`Why sp C–H bonds are shorter, stronger and more acidic.`,screens:[{title:`The trend`,body:`Nominal s-character is sp 50%, sp² 33.3% and sp³ 25%. More s-character gives shorter, stronger bonds and a more acidic C–H.`},{title:`What follows`,body:`The direction of the trend is the exam point. The numbers below are approximate textbook values, and measured values differ slightly between sources: ethane sp³ C–H ≈1.10 Å, pKa ≈50; ethene sp² ≈1.08 Å, pKa ≈44; ethyne sp ≈1.06 Å, pKa ≈25.`},{title:`Worked example: ethyne`,body:`Each carbon in ethyne has two σ bonds (one to the other carbon, one to H) and no lone pairs, so SN = 2, hybridization sp, molecular geometry linear. The sp C–H is the shortest and most acidic in the table.`,exampleMoleculeId:`ethyne`}]},{id:`exam-traps`,title:`Exam traps`,summary:`The five mistakes and the conventions to label.`,screens:[{title:`Traps 1 and 2`,body:`Do not forget lone pairs when you count SN. Do not count π bonds toward SN. A double bond still contributes only one σ to the count.`},{title:`Trap 3`,body:`NH₃ and H₂O are not "tetrahedral" as molecular shapes. Their electron geometry is tetrahedral, but their molecular shapes are trigonal pyramidal and bent.`,exampleMoleculeId:`ammonia`},{title:`Trap 4`,body:`Do not forget lone-pair compression of angles. Lone pairs push bond angles below the ideal value.`},{title:`Trap 5`,body:`Do not hybridize hydrogen. H uses a pure 1s orbital. Also remember that terminal atoms are not assessed here because textbooks differ on how to label them. Check your course convention.`},{title:`Conventions`,body:`sp³d and sp³d² are traditional textbook labels for 5- and 6-domain atoms. Modern calculations suggest d orbitals contribute very little to bonding in these molecules. Learn the labels if your course tests them.`}]}],me=[`walkthrough`,`local-viewer`,`orbital-mixing`,`overlap-diagrams`,`assign-builder`],he={page:`notFound`},ge={page:`home`},_e={learn:{page:`learn`},tools:{page:`tools`},practice:{page:`practice`},review:{page:`review`},exam:{page:`exam`},cheatsheet:{page:`cheatsheet`},settings:{page:`settings`}};function ve(e){try{return decodeURIComponent(e)}catch{return null}}function ye(e){return me.includes(e)}function be(e){return pe.some(t=>t.id===e)}function xe(e){if(typeof e!=`string`||e.length===0)return he;let t=e.startsWith(`#`)?e.slice(1):e,n=t.indexOf(`?`);if(n>=0&&(t=t.slice(0,n)),!t.startsWith(`/`))return he;if(t===`/`)return ge;let r=t.slice(1).split(`/`),i=[];for(let
